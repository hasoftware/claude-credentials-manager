{{ template "header.html" . }}
<div class="access-layout">
  <div class="access-print" aria-hidden="true"><div class="print-frame"><div class="arch"><div class="keyhole"></div></div></div></div>
  <section class="theme-panel">
    <h1 class="theme-heading">Sign in</h1>
    <p class="form-intro">Use your HASOFT account to continue.</p>
    <form method="post" action="{{ .PostURL }}">
      <div class="theme-form-row">
        <label class="theme-form-label" for="login">{{ .UsernamePrompt }}</label>
        <input required id="login" name="login" type="text" class="theme-form-input" autocomplete="username" {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}>
      </div>
      <div class="theme-form-row">
        <label class="theme-form-label" for="password">Password</label>
        <input required id="password" name="password" type="password" class="theme-form-input" autocomplete="current-password" {{ if .Invalid }}autofocus aria-invalid="true" aria-describedby="login-error"{{ end }}>
      </div>
      {{ if .Invalid }}<p id="login-error" role="alert" class="dex-error-box">Invalid {{ .UsernamePrompt }} or password.</p>{{ end }}
      {{ if .ShowRememberMe }}<div class="theme-form-row"><label class="theme-remember-me"><input type="checkbox" name="remember_me" {{ if .RememberMeChecked }}checked{{ end }}> Remember me</label></div>{{ end }}
      <button id="submit-login" type="submit" class="dex-btn theme-btn--primary">Sign in <span aria-hidden="true">→</span></button>
    </form>
    {{ if .BackLink }}<div class="theme-link-back"><a class="dex-subtle-text" href="{{ .BackLink }}">Select another login method</a></div>{{ end }}
  </section>
</div>
<script>
  document.getElementById("submit-login").form.addEventListener("submit", function () {
    document.getElementById("submit-login").disabled = true;
  });
</script>
{{ template "footer.html" . }}
